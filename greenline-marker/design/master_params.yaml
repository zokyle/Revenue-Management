# GreenLine GL-1 — master parameters (single source of truth for mechanical CAD and PCB layout)
# Units: mm. Frame: origin at puck centre on the BASE PLANE (the plane that rests on the turf),
# +x = right, +y = forward (toward the ball / hole), +z = up, as seen from above.
# Status of every dimension is given in `basis`: datasheet | search-verified | provisional (must be
# checked against the manufacturer drawing before release) | design (our choice).
rev: C-EVT1          # rev C: mechanical feedback folded in (see mechanical/PROPOSED_PARAM_CHANGES.md and DESIGN_SPEC section 5)
envelope:
  outer_radius: 23.0          # dia 46.0, design
  thickness: 7.6              # design: every printed wall >= 0.8 mm (MJF PA12 bureau minimums 0.76-1.0 mm)
  wall: 1.0                   # side wall, MJF PA12 vapor-smoothed, design
  min_printed_wall: 0.8
  fit_clearance: 0.25         # nominal gap for every drop-in fit (MJF tolerance +-0.2 to 0.3 mm)
  front_flat_y_outer: 18.4    # D-cut "visor" flat face that carries the two camera openings
  front_flat_wall: 0.8
base_plate:
  thickness: 0.87             # z 0..0.87; with the 0.13 mm adhesive sheet the PCB bottom stays at z = 1.00
  psa: {mpn: "3M 9472LE (300LSE) adhesive transfer tape, die cut", thickness: 0.13, basis: provisional}   # z 0.87..1.00; seals the pad slot and the grain opening
  radius: 21.75               # drops into the tub from below (0.25 radial clearance)
  flat_y: 18.25               # base plate runs UNDER the visor wall on the flat front (wall sits on the base there)
  seal_land: {r_inner: 21.35, r_outer: 21.75, flat_y_inner: 17.6}   # dispensed adhesive bead (not tape: the land is only 0.4 mm wide); the 0.25 mm radial gap to the wall is filled too
  grain_cavity: {x: 0.0, y: -4.0, dia: 13.0}    # through-opening; PCB bottom is the cavity ceiling
  # the seven pad positions share ONE slot (2.2 mm holes on 2.54 pitch would leave 0.34 mm webs)
  pad_holes: {form: slot, dia: 2.2, slot_length: 17.44, y: -17.0, xs: [-7.62, -5.08, -2.54, 0.0, 2.54, 5.08, 7.62]}
  # ball feet: THROUGH holes; the balls are set on a gauge plate with 0.10 mm pockets and potted with UV epoxy from
  # the inside before the adhesive sheet goes on (the print cannot hold a 0.10 mm protrusion). Ball top is at z = 0.90,
  # 0.03 above the plate, inside a 2.0 mm hole in the adhesive sheet.
  feet: {ball_dia: 1.0, protrusion: 0.10, hole_dia: 1.15, psa_hole_dia: 2.0, positions: [[0.0, 15.0], [-16.5, -9.5], [16.5, -9.5]]}
  baffle: {inner_dia: 5.91, wall: 0.8, outer_dia: 7.51, spokes_deg: [90, 225, 315], spoke_width: 0.8}
pcb:
  thickness: 0.8              # 4-layer FR-4, ENIG; z 1.0 .. 1.8
  z_bottom: 1.0
  radius: 21.1                # 0.25 mm to the tub ledge (r 21.35)
  flat_y: 17.3
  # two non-plated holes that take printed spigots on tub posts E: they locate the PCB (and so the cameras) to the tub
  locating_holes: {round: {x: -4.2, y: 14.55, dia: 1.15}, slot: {x: 4.2, y: 14.55, dia: 1.15, length_x: 1.65}, spigot_dia: 1.0, spigot_height: 0.6}
  component_edge_clearance: 0.2
  max_top_height_under_lcd: 2.55   # battery+swell or parts must stay below z = 4.35
tub_ledge: {r_inner: 21.35, z0: 1.2, z1: 2.2}    # inward step of the tub wall that seats on the seal
lcd:
  mpn: LS013B7DH03
  glass: {x: 0.0, y: -1.65, dx: 26.6, dy: 30.3, z0: 4.65, z1: 5.40}   # outline search-verified (Sharp brochure 26.6 x 30.3 x 0.746)
  active: {x: 0.0, y: 0.0, dx: 23.04, dy: 23.04}                         # active-area offset from glass centre is PROVISIONAL (1.65 mm)
  aperture_dia: 22.0
  fpc_exit_edge: rear        # driver ledge / FPC at the -y edge of the glass; tail geometry PROVISIONAL
  psa_thickness: 0.15
cover_glass: {dia: 28.0, thickness: 1.0, recess_dia: 28.5, recess_depth: 1.25, bond: "VHB 5907 ring 0.2 mm"}
battery:
  mpn: GM201030-PCB           # PowerStream, 2 x 10 x 30 mm cell + PCM (search-verified listing; PCM length provisional)
  body: {x: 0.0, y: -5.2, dx: 34.0, dy: 10.0, z0: 1.8, z1: 3.8}
  swell_allowance: 0.4
  foam_above: 0.3
cameras:
  mpn: OVM7692-RYAA           # 2.95 x 3.47 x 2.76 mm cube (search-verified product-brief dims); ball map PROVISIONAL
  body_dx: 3.47
  body_dy: 2.95
  height: 2.76
  left:  {x: -10.0, y: 15.6}
  right: {x: 10.0, y: 15.6}
  baseline: 20.0
  efl_mm: 1.15
  pixel_um: 1.75
  f_px: 657
  fov_deg: {h: 51.9, v: 40.1}     # landscape: 640 px along x
prisms:
  mpn: "Edmund Optics 32-526"     # 2.0 mm legs, N-BK7, aluminised hypotenuse (search-verified)
  leg: 2.0
  bond_line: 0.05
  # prism sits centred on the cube lens axis; exit face looks +y
  exit_face_y: 16.6
  optical_axis_z: 5.61            # 1.8 + 2.76 + 0.05 + 1.0
roof: {underside_z: 6.8, thickness: 0.8, prism_pocket_underside_z: 6.8}
visor_window:               # one per camera, centred on the camera x, bonded in a recess on the flat visor face
  w: 5.0
  h: 3.4
  t: 0.5
  recess_w: 5.5              # 0.25 mm per side
  recess_depth: 0.55         # recess is open to the top surface (window top edge flush with the top)
  z0: 4.2
  z1: 7.6
  opening: {half_w: 2.0, z0: 4.6, z1: 6.8}    # clear aperture through the visor wall; the pupil bundle is +-1.62 wide here for the +-26 deg field
  # accepted local deviation: the wall behind the recess, in front of each camera cube (z 4.2..4.6, about 5 x 0.4 mm), is
  # 0.525 mm instead of 0.8; the bonded window backs it. The lower field is needed only to about -8 deg (the flagstick
  # base sits near the horizon), so the sill stays at 4.6.
  min_wall_behind_recess: 0.525
  material: "EVT: 0.5 mm clear cast acrylic or cover glass; production: AR-coated borosilicate or sapphire, custom cut"
vent: {type: "W. L. Gore VE80205 adhesive ePTFE vent, OD 5.0, vent dia 2.0, 0.26 thick", hole_dia: 1.0, x: 17.9, y: -3.0, location: "roof underside, on a pad raised 0.2 mm", basis: provisional}
# Tub features that land on or hang over the PCB top side: nothing but the named part may sit inside them.
tub_keepouts:
  post_feet: {size: 1.6, centres: [[-15.4, 1.8], [15.4, 1.8], [-14.35, 10.8], [14.35, 10.8], [-6.5, -18.6], [6.5, -18.6], [-4.2, 14.55], [4.2, 14.55]]}
  camera_hoods: {half_w: 2.85, y0: 13.7, y1: 17.3, max_part_height: 0.95, note: "per camera, centred on the camera x; the camera cube itself is exempt"}
# Charging / data dock. The puck seats at 0 degrees only and is held down against the spring pins.
cradle:
  body: {dx: 60.0, dy: 60.0, dz: 14.0}
  orientations: [0]
  pad_plane_z: 1.0            # contact pads on the PCB underside, above the puck base plane
  pin_row_y: -17.0
  pins: {mpn_series: "Mill-Max 0914 long-stroke spring pin", positions: 7, populated_consumer: [VBUS, D-, D+, GND], populated_factory: 7, working_height: 5.82, force_working_N: 0.59, basis: provisional}
  hold_down: "fixed front lip between the camera windows (|x| <= 6) plus a rear cantilever latch with a thumb tab; retention at least 3x the total pin force"
  pcb: {dx: 30.0, dy: 22.0, thickness: 1.6, connector: "GCT USB4105 USB-C receptacle, rear exit"}
top_side_parts:   # name, x, y, dx, dy, height (z above PCB top = 1.8); footprint courtyard sizes
  - {ref: U1,  name: "STM32U585RIT6 LQFP-64",       x: 0.0,   y: 7.2,   dx: 12.2, dy: 12.2, h: 1.6}
  - {ref: U2,  name: "OVM7692 camera L",            x: -10.0, y: 15.6,  dx: 3.47, dy: 2.95, h: 2.76}
  - {ref: U3,  name: "OVM7692 camera R",            x: 10.0,  y: 15.6,  dx: 3.47, dy: 2.95, h: 2.76}
  - {ref: U4,  name: "LSM6DSV16X IMU LGA-14",       x: -11.0, y: 6.0,   dx: 3.0,  dy: 2.5,  h: 0.86}
  - {ref: U6,  name: "MX25R6435F flash WSON-8 6x5", x: 11.5,  y: 6.4,   dx: 6.4,  dy: 5.4,  h: 0.8}
  - {ref: U8,  name: "LP5907-2.8 LDO SOT-23-5",     x: 0.0,   y: 15.3,  dx: 3.0,  dy: 3.0,  h: 1.45}
  - {ref: BT1, name: "LiPo GM201030-PCB",           x: 0.0,   y: -5.2,  dx: 34.0, dy: 10.0, h: 2.4}
  - {ref: J1,  name: "LCD FPC conn FH12A-10S-0.5SH top-contact", x: 0.0, y: -13.9, dx: 8.4, dy: 5.8, h: 2.0}
  - {ref: U7,  name: "MCP1700-2.8 LDO SOT-23",      x: 10.5,  y: -13.5, dx: 3.0,  dy: 3.0,  h: 1.2}
  - {ref: U11, name: "MCP1700-3.3 LDO SOT-23 (VDDUSB)", x: 14.0, y: -12.2, dx: 3.0,  dy: 3.0,  h: 1.2}
  - {ref: U9,  name: "MCP73831 charger SOT-23-5",   x: -10.5, y: -13.5, dx: 3.0,  dy: 3.0,  h: 1.45}
  - {ref: U10, name: "USBLC6-2SC6 ESD SOT-23-6",    x: -14.3, y: -12.0, dx: 3.0,  dy: 3.0,  h: 1.45}
  - {ref: Y1,  name: "32.768 kHz xtal 3215",        x: 8.6,   y: 12.2,  dx: 3.4,  dy: 1.7,  h: 0.9}
bottom_side_parts:
  grain_led_ring: {x: 0.0, y: -4.0, radius: 5.2, count_pairs: 8, first_azimuth_deg: 22.5, step_deg: 45.0, led_height: 0.45}   # azimuth CCW from +x seen from above
  photodiode: {x: 0.0, y: -4.0, dx: 4.8, dy: 2.5, h: 0.48}
  pads: "7 gold pads dia 1.8 at base_plate.pad_holes (VBUS, D-, D+, GND, SWDIO, SWCLK, NRST)"
