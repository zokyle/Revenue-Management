# GreenLine GL-1 — master parameters (single source of truth for mechanical CAD and PCB layout)
# Units: mm. Frame: origin at puck centre on the BASE PLANE (the plane that rests on the turf),
# +x = right, +y = forward (toward the ball / hole), +z = up, as seen from above.
# Status of every dimension is given in `basis`: datasheet | search-verified | provisional (must be
# checked against the manufacturer drawing before release) | design (our choice).
rev: E-EVT1          # rev E: the routed boards folded back in, and the amendments E17 to E28, E35 and E36 of DESIGN_SPEC.md entered
# History: rev D = decisions on the rev C design review, amended in place by N1 to N10 of the rev D mechanical review
# (mechanical/PROPOSED_PARAM_CHANGES.md part B; marked "N<n>" below) and by the spec amendments E1 to E16.
# Rev E enters: E17 (guaranteed upper field 14.0 deg on the loosest locating fit), E18 (legend print rules), E19 (retarder
# film), E20 (plate thickness accepted, ball tolerance), E21 (baffle-ring rule), E22 (display rotation, cell adhesive),
# E23 (requirements, PROPOSED), E24 (J1 and the LCD-tail keep-out), E25 / E26 (U12, U11: in the part list), E35 (fine
# class on three layers), E36 (cradle board 1.0 mm). top_side_parts and bottom_side_parts.board_parts are regenerated
# from the routed board (electrical/gl1_main/out/gl1_main-mechanical.json). Items marked "E<n>" below; the proposals
# N11 to N19 of mechanical/PROPOSED_PARAM_CHANGES.md part C are the same changes as E17 to E22.
# Nothing here has been built or measured.
envelope:
  outer_radius: 23.0          # dia 46.0, design
  thickness: 7.6              # design: every printed wall >= 0.8 mm (MJF PA12 bureau minimums 0.76-1.0 mm)
  wall: 1.0                   # side wall, MJF PA12 vapor-smoothed, design
  min_printed_wall: 0.8
  fit_clearance: 0.25         # nominal gap for every drop-in fit (MJF tolerance +-0.2 to 0.3 mm)
  front_flat_y_outer: 18.4    # D-cut "visor" flat face that carries the two camera openings
  front_flat_wall: 0.8
  rim_relief: 0.25            # the tub side wall ends 0.25 above the base plane, so the three ball feet are the seat on any tolerance stack
base_plate:
  # PRIMARY: routed from 0.80 mm FR-4 by the PCB fabricator (same expansion as the PCB it is laminated to, so the
  # laminate that carries the IMU, the cameras and the feet does not bow with temperature or humidity; flat and stiff).
  material: "FR-4 0.80 mm, matte black solder mask both sides, no copper, routed outline, drilled holes"
  thickness: 0.80             # z 0..0.80; with the 0.20 mm adhesive sheet the PCB bottom stays at z = 1.00
  # N6: fabrication tolerances (drawing GL1-011). Plates are sorted on thickness at incoming inspection: the lower limit
  # keeps 0.02 mm of epoxy between each ball and its PCB land. The plate thickness is NOT in the seal-joint chain.
  # E20 (N11): lower limit 0.78 (was 0.76), so that the 0.02 mm of epoxy also holds under a ball at the upper diameter
  # limit of grade 100 (feet.dia_tol): at 0.76 such a ball left 0.007 mm.
  tolerances: {outline: 0.10, holes: 0.05, thickness_over_mask: 0.10}
  thickness_accepted: [0.78, 0.90]
  mask_relief_dia: 1.25       # solder mask pulled back round each ball-foot hole, both faces
  # E10: legend on the outer face. E18 (N12, N19) print rules: line and space 0.15 or more, text height 1.0 or more, ink
  # 0.03 or less; no ink within dia 8.5 of a ball foot (seat zone = seat pad 7.0 + 2 x (0.6 location + 0.15 registration))
  # or within 0.75 of the routed outline. Each of the two statement blocks holds 88 characters at these rules; text that
  # does not fit goes in the user guide and on the packaging. The print rules are to be confirmed with the fabricator's
  # quote. A laser-marked legend needs none of the seat-zone rules.
  legend: {side: outer, process: "white legend print on the black mask, or laser mark", clear_of_features: 1.0, content: "maker, model, Practice device, required statements (docs/COMPLIANCE.md), serial-number box",
           min_line: 0.15, min_space: 0.15, min_text_height: 1.0, thickness_max: 0.03, seat_zones_clear_dia: 8.5, edge_margin: 0.75, registration: 0.15, statement_block_chars: 88, print_rules_basis: provisional,
           fixture_rule: "every fixture or gauge that takes the outer face as its reference bears on bare mask inside the seat zones: gauge plate on three bosses, seat plate on three pads next to the feet, bridge depth gauge"}
  psa: {mpn: "3M 93020LE (300LSE) double-coated tape, die cut", thickness: 0.20, basis: provisional}   # z 0.80..1.00; seals the pad slot and the grain opening
  # ALTERNATIVE for an all-printed build and for the EVT comparison: same outline and features in MJF PA12.
  alternative: {material: "HP MJF PA12, dyed black, NOT vapor smoothed, free-state flatness 0.3 max", thickness: 0.87, psa_thickness: 0.13, psa_mpn: "3M 9472LE (300LSE) adhesive transfer tape", foot_hole_dia: 1.15, baffle: integral, thickness_accepted: [0.84, 0.92]}   # E20: lower limit 0.84 (was 0.83)
  radius: 21.75               # drops into the tub from below (0.25 radial clearance)
  flat_y: 18.25               # base plate runs UNDER the visor wall on the flat front (wall sits on the base there)
  seal_land: {r_inner: 21.35, r_outer: 21.75, flat_y_inner: 17.6}   # dispensed adhesive bead (not tape: the land is only 0.4 mm wide); the 0.25 mm radial gap to the wall is filled too
  # through-opening; PCB bottom is the cavity ceiling. Filled flush with a clear, hard, low-fluorescence potting so that
  # mud and dew cannot reach the LEDs and the photodiode (0.05 below the base plane; the ball feet stand 0.10 proud).
  # N4: the potting surface must never come closer to the base plane than z 0.05 (the ball feet stand only 0.10 proud);
  # the fill is aimed at z 0.10 and accepted up to z 0.20 (deeper inside), measured wet and trimmed before cure.
  grain_cavity: {x: 0.0, y: -4.0, dia: 13.0, fill: "clear optical epoxy", fill_surface_z: {never_below: 0.05, target: 0.10, max: 0.20, below_ring_crest: [0.0, 0.10]}, fill_volume_nominal_mm3: 93.4, fill_basis: provisional}
  # the seven pad positions share ONE slot (2.2 mm holes on 2.54 pitch would leave 0.34 mm webs)
  pad_holes: {form: slot, dia: 2.2, slot_length: 17.44, y: -17.0, xs: [-7.62, -5.08, -2.54, 0.0, 2.54, 5.08, 7.62]}
  # ball feet: THROUGH holes; the balls are set on a gauge plate with 0.10 mm pockets (E18: the plate bears on three
  # bosses on bare mask, not on its whole face) and potted from the inside with a
  # dual-cure or two-part epoxy (the joint is shadowed, a UV-only adhesive stays liquid) before the adhesive sheet goes
  # on; the sheet hole is back-filled, so each ball bears on a copper land on the PCB underside through 0.10 mm of epoxy.
  # E20: dia_tol is the diameter tolerance taken for a grade 100 ball (+-0.0127 mm, AS REMEMBERED from the ball standard:
  # PROVISIONAL, to be confirmed against the standard or the supplier's certificate).
  feet: {ball_dia: 1.0, dia_tol: 0.0127, dia_tol_basis: provisional, material: "316 stainless grade 100 or better, or silicon nitride; not 440C (E8)", protrusion: 0.10, hole_dia: 1.10, psa_hole_dia: 2.0, positions: [[0.0, 15.0], [-16.5, -9.5], [16.5, -9.5]], epoxy_dome_max: 0.08, backfill: true, pcb_keepout_dia: 2.5, pcb_land_dia: 1.6}
  # light baffle round the photodiode. FR-4 plate: a separate printed black PA12 ring (no spokes) bonded to the PCB on a
  # die-cut adhesive annulus, its top flush with the potting. PA12 plate: integral with the plate on three spokes.
  baffle: {inner_dia: 6.6, wall: 0.8, outer_dia: 8.2, spokes_deg: [90, 225, 315], spoke_width: 0.8,
           # N4: separate ring of the FR-4 build. E21 (N15): finished height = measured plate thickness + 0.15 - thickness
           # of the tape actually used (0.82 for the 0.80 plate on a 0.13 tape; 0.85 on 0.10; 0.805 on 0.145; 0.755 to 0.95 over
           # the accepted plates). The earlier rule "plate + 0.02" held for a 0.13 tape only. Rings are printed 1.10 high and lapped.
           ring: {height: 0.82, height_tol: [-0.03, 0.0], matched_to: "measured plate thickness + 0.15 - tape thickness", rule_offset: 0.15, tape: [0.10, 0.145], nominal_tape: 0.13, print_height: 1.10,
                  adhesive: "opaque black double-coated tape, 0.10 to 0.145 as available (E16)", crest_z: [0.0, 0.15]}}
pcb:
  thickness: 0.8              # 4-layer FR-4, ENIG; z 1.0 .. 1.8
  z_bottom: 1.0
  radius: 21.1                # 0.25 mm to the tub ledge (r 21.35)
  flat_y: 17.3
  # E35: net classes of the routed board. The fine class may be used on the three named layers inside two rule areas that
  # extend 5 mm beyond each camera ball field (about 13 % of the board; 218 mm of fine track on 28 nets on the routed
  # board); everywhere else the default class stands. 0.100 mm is 3.94 mil: the fabricator's written acceptance on all
  # three layers is a release gate (E7).
  net_classes:
    default: {track: 0.15, clearance: 0.127}
    fine: {track: 0.10, clearance: 0.10, layers: [F.Cu, In2.Cu, B.Cu], area_beyond_camera_ball_field: 5.0, basis: "E35; fabricator acceptance is a release gate (E7)"}
  via_drill: 0.25
  # two non-plated holes that take printed spigots on tub posts B: they locate the PCB (and so the cameras) to the tub.
  # The cameras lie between the spigots (28.7 mm apart), so 0.075 mm of fit is 0.075 mm and 0.3 degrees at a camera.
  # Round hole at +x, slot at -x. Go gauge dia 1.10 on the spigots at first article.
  # E17 (N18): the fit is toleranced. Hole and slot width dia 1.15 +0.05 / -0, spigot dia 1.0 +0 / -0.05, so the nominal
  # fit is +-0.075 (0.15 on diameter) and the loosest fit +-0.125 (0.25 on diameter); spigots are checked with a no-go
  # gauge at dia 0.95 beside the dia 1.10 go gauge. cameras.field_required_deg.up_guaranteed is defined on fit_max.
  locating_holes: {round: {x: 14.35, y: 10.8, dia: 1.15}, slot: {x: -14.35, y: 10.8, dia: 1.15, length_x: 2.2}, spigot_dia: 1.0, spigot_height: 0.6,
                   dia_tol: [0.0, 0.05], spigot_dia_tol: [-0.05, 0.0], spigot_dia_min: 0.95, fit_nominal: 0.075, fit_max: 0.125}
  component_edge_clearance: 0.2
  max_top_height_under_lcd: 2.55   # battery+swell or parts must stay below z = 4.35
tub_ledge: {r_inner: 21.35, z0: 1.2, z1: 2.2}    # inward step of the tub wall that seats on the seal
lcd:
  mpn: LS013B7DH03
  glass: {x: 0.0, y: -1.65, dx: 26.6, dy: 30.3, z0: 4.65, z1: 5.40}   # outline search-verified (Sharp brochure 26.6 x 30.3 x 0.746)
  active: {x: 0.0, y: 0.0, dx: 23.04, dy: 23.04}                         # active-area offset from glass centre is PROVISIONAL (1.65 mm)
  aperture_dia: 22.0
  fpc_exit_edge: rear        # driver ledge / FPC at the -y edge of the glass; tail geometry PROVISIONAL
  psa_thickness: 0.15
  # E22 (N16): the glass can turn up to about 1.2 degrees in its pocket (computed 1.19 on the tub solid; E12 said "about
  # 1 degree"). It is squared against the two rear ribs at assembly; the factory measures what is left and stores it.
  rotation_in_pocket_max_deg: 1.2
# EVT: flat mineral watch crystal (NOT step-proof). Production: chemically strengthened glass or sapphire specified by
# strength (ring-on-ring 600 MPa or more), 1.0 mm, printed black border.
cover_glass: {dia: 28.0, thickness: 1.0, recess_dia: 28.5, recess_depth: 1.25, bond: "3M 9472LE transfer tape ring 0.13 mm, OD 28.0 / ID 25.0", bond_thickness: 0.13, bond_id: 25.0, sub_flush: 0.12,
              # E19 (N13): the trial film is dia 23.4 with a clocking flat (a chord 4.3 long at y = 11.5, toward the visor) that
              # carries its axis; 0.11 or less with its laminating adhesive; placed on the glass within 0.25.
              retarder: {type: "quarter-wave film, about 0.1 mm, on the glass underside, axis 45 deg to the LCD polariser", status: "EVT trial (E9)", basis: provisional,
                         dia: 23.4, clocking_flat: {y: 11.5, length: 4.3}, thickness_max: 0.11, placement: 0.25}}
battery:
  mpn: GM201030-PCB           # PowerStream, 2 x 10 x 30 mm cell + PCM (search-verified listing; PCM length provisional)
  body: {x: 0.0, y: -5.2, dx: 34.0, dy: 10.0, z0: 1.8, z1: 3.8}
  swell_allowance: 0.4
  foam_above: 0.3
  fixing_adhesive_max: 0.06   # E22 (N17): was 0.05, no tape of 0.05 was found (the transfer tapes named are about 0.058). The cell is tacked to the PCB; maximum delivered thickness and end-of-life swelling are release-gate data
  # E24: the signal pads of J1 end at y = -10.40, 0.20 from the cell edge at y = -10.20 (body.y - body.dy / 2).
  # DECISION on the 0.3 mm notch that the routed board has in its battery_body placement keep-out: `body` above stays
  # the full rectangle and does NOT take the notch. Reason, from the geometry: the notch (x -5.55 to 5.55, y -10.20 to
  # -9.90) is J1's COURTYARD, the drafting margin of 0.50 mm that KiCad's land pattern draws beyond the pad ends
  # (-10.40 + 0.50 = -9.90); nothing of J1 is inside it (pads and solder end at -10.40, the housing at -11.70, both
  # outside the cell box), while the cell itself does occupy that strip. `body` is the solid the tub, the foam, the
  # swelling check and the board import use, so cutting it would misstate the cell. The notch is a property of the
  # layout tool's placement rule (it tests courtyards) and is recorded here so that the board import can require
  # "body less exactly this notch" instead of warning.
  board_keepout_notch: {ref: J1, x: [-5.55, 5.55], y: [-10.2, -9.9], reason: "J1 courtyard only; no copper, solder or body of J1 inside the cell box", pad_to_cell_gap: 0.20}
  # solder pads for the two cell leads: in the strip between the protection-board end of the cell (x = -17) and the board edge
  pads: {zone: {x: [-19.3, -17.5], y: [-7.0, -1.5]}, size: [1.5, 2.4], joint_max_height: 2.4, basis: design,
         centres: {BAT+: [-18.4, -2.7], BAT-: [-18.4, -5.8]}}   # centres as routed (board refs BT1 = BAT+, BT2 = BAT-; the YAML part BT1 below is the cell)
cameras:
  mpn: OVM7692-RYAA           # 2.95 x 3.47 x 2.76 mm cube (search-verified product-brief dims); ball map PROVISIONAL
  body_dx: 3.47
  body_dy: 2.95
  height: 2.76
  left:  {x: -10.0, y: 15.6}
  right: {x: 10.0, y: 15.6}
  baseline: 20.0
  efl_mm: 1.15
  pixel_um: 1.75
  f_px: 657
  fov_deg: {h: 51.9, v: 40.1}     # landscape: 640 px along x
  # field the enclosure must leave clear (half angles). The upper edge has only 0.054 mm of margin to the roof.
  # E17 (N18, replaces the definition of N3): up_guaranteed is the worst case with the optics 0.2 mm high, the LOOSEST
  # locating fit (pcb.locating_holes.fit_max = 0.125) against it and the roof at -10 C. Model: 14.03 deg there; 14.61 at
  # the nominal 0.075 fit and 20 C, 14.97 without any play, 18.56 nominal. The old figure of 14.5 held at the nominal fit
  # only (the +0.05 hole tolerance alone gave 14.496). Accepted: it delays stick-top visibility from 6.6 m to about 8.4 m
  # on a worst-case unit (8.1 m before). The pupil position and diameter behind these figures are still assumed
  # (OmniVision lens data: release gate).
  field_required_deg: {h: 26.0, up: 17.6, up_guaranteed: 14.0, down: 8.0}
  up_guaranteed_case: {optics_high: 0.2, locating_fit: 0.125, roof_temperature_C: -10, model_deg: 14.03}
  # E17: test gate 2 (manufacturing station J3, validation O1): target bar at +13.0 deg and reference bar at -13.0 deg
  # (guaranteed 14.0 less 1.0 for the placement of target and unit); +-13.5 before.
  gate2_bars_deg: [13.0, -13.0]
prisms:
  mpn: "Edmund Optics 32-526"     # 2.0 mm legs, N-BK7, aluminised hypotenuse (search-verified)
  leg: 2.0
  bond_line: 0.05
  # prism sits centred on the cube lens axis; exit face looks +y
  exit_face_y: 16.6
  optical_axis_z: 5.61            # 1.8 + 2.76 + 0.05 + 1.0
roof: {underside_z: 6.8, thickness: 0.8, prism_pocket_underside_z: 6.8}
visor_window:               # one per camera, centred on the camera x, bonded in a recess on the flat visor face
  w: 5.0
  h: 3.25                    # top edge 0.15 below the tub top
  t: 0.4                     # 0.15 below the visor face in the 0.55 recess (was flush: one in four would have stood proud)
  recess_w: 5.5              # 0.25 mm per side
  recess_depth: 0.55         # recess is open to the top surface
  z0: 4.2
  z1: 7.6                    # recess; the window itself ends at z 7.45
  opening: {half_w: 2.0, z0: 4.6, z1: 6.8}    # straight (not bevelled) clear aperture through the visor wall; the pupil bundle is +-1.62 wide here for the +-26 deg field
  # accepted local deviation: the wall behind the recess, in front of each camera cube (z 4.2..4.6, about 5 x 0.4 mm), is
  # 0.525 mm instead of 0.8; the bonded window backs it. The lower field is needed only to about -8 deg (the flagstick
  # base sits near the horizon), so the sill stays at 4.6.
  min_wall_behind_recess: 0.525
  # N2: recess 0.55 - glass 0.40 - 0.15 leaves no adhesive line behind the glass. The glass seats bare on the recess
  # floor and is sealed by a frame of non-slumping adhesive round its edge; nothing is wicked (it would reach the roof
  # edge of the opening, where the light bundle has 0.054 mm).
  sub_flush: 0.15
  bond_line: 0.0
  bond: "frame of thixotropic adhesive round the glass edge: side gaps, top bead 0.10, sill fillet 0.12 x 0.12; nothing behind the glass"
  material: "0.40 mm borosilicate (SCHOTT D 263 T eco class), custom cut 5.0 x 3.25; AR coating optional at EVT"
vent: {type: "W. L. Gore VE80205 adhesive ePTFE vent, OD 5.0, vent dia 2.0, 0.26 thick", hole_dia: 1.0, x: 17.9, y: -3.0, location: "roof underside, on a pad raised 0.3 mm that runs out to the side wall; two drain grooves 0.6 wide x 0.3 deep cross at the vent hole on the top face", basis: provisional}
# Contract between the tub and the board layout. Outside the named keep-outs a top-side part may be up to
# free_height_above_pcb tall anywhere on the board (the tub is proven clear of that space); the cameras are exempt.
tub_keepouts:
  free_height_above_pcb: 2.55     # z 4.35
  post_feet:
    size: 1.6
    centres: [[-15.4, 1.8], [15.4, 1.8], [-6.5, -18.6], [6.5, -18.6], [-4.2, 14.55], [4.2, 14.55]]
    # N1: the 2.2 squares are the layout keep-outs. The feet as built are 1.9 x 2.2 with their inner faces at
    # x = +-13.55, because the 26.6 mm LCD glass passes between posts B on its way in.
    locating: {size: 2.2, centres: [[-14.35, 10.8], [14.35, 10.8]], foot: {dx: 1.9, dy: 2.2, x_inner: 13.55}}    # posts B: carry the two PCB spigots
  camera_hoods: {half_w: 2.85, y0: 13.7, y1: 17.3, max_part_height: 0.95, note: "per camera, centred on the camera x; the camera cube itself is exempt"}
  # each ball foot bears on the PCB: bottom side dia 2.5 with no via and no track, and an unmasked copper land dia 1.6;
  # top side no soldered part inside the same circle (the battery may lie over the two rear feet)
  foot_zones: {dia: 2.5, land_dia: 1.6, positions: [[0.0, 15.0], [-16.5, -9.5], [16.5, -9.5]], part_margin: 0.3}   # N7: free parts keep 0.3 mm from a zone at layout
  # N10: the LCD flex tail folds down behind the mouth of J1 (underside about 0.93 mm above the PCB). PROVISIONAL until
  # the Sharp tail drawing is in hand (release gate B16). J1 itself is exempt.
  # E24: re-derived from the new mouth. y[1] = the mouth of J1 = -17.30 (was -16.80). y[0] = -21.1 = the rear edge of
  # the board (pcb.radius), was -18.3 = mouth - 1.5. Derivation: the fold now has to lie wholly behind y = -17.30 and its
  # length is not known; in plan the tub does not limit it before the board ends (tub ledge r 21.35 and inner wall r 22.0:
  # y = -21.10 and -21.76 at x = +-3.25, against the board edge at y = -20.85 there and -21.10 at x = 0), and below the
  # free height the tub has only its post feet over the board, the nearest at |x| >= 5.7. So the whole strip of board
  # behind the mouth is kept low. Nothing on the routed board is in it (check_layout.py). NOT verified here: the room
  # for the fold ABOVE the free height (roof, LCD pocket, rear ribs). The mechanical model must re-model the fold behind
  # y = -17.30 (the rev D fold started 0.35 behind the glass edge at y = -16.80, i.e. in FRONT of the new mouth) and
  # may then shorten this zone to what the fold needs.
  # Fallback if the fold does not fit (E24): a 1.0 mm high back-flip connector about 3.5 mm deep.
  lcd_tail: {half_w: 3.25, y: [-21.1, -17.3], max_part_height: 0.7, basis: provisional}
# Charging / data dock. The puck seats at 0 degrees only and is held down against the spring pins.
cradle:
  body: {dx: 60.0, dy: 60.0, dz: 14.0, y: [-36.0, 24.0], overall_height: 22.63}    # not centred on the marker
  orientations: [0]
  seat_z: -0.10               # front strip and two pads under the ball feet; the rest of the nest floor is a drained basin
  pad_plane_z: 0.965          # copper face of the contact pads (PCB underside is z 1.00)
  pin_row_y: -17.0
  pins: {mpn_series: "Mill-Max 0914 long-stroke spring pin", positions: 7, populated_consumer: [VBUS, D-, D+, GND], populated_factory: 7, working_height: 5.82, compression: 1.14, stroke: 2.29, force_working_N: 0.59, tail_length: 1.34, basis: provisional}   # E36: tail_length is an estimate
  float: 0.25                 # with pins fitted the marker is pushed up against lip and hook; the pins then stand 6.07 high
  hold_down:
    summary: "fixed front lip between the camera windows (|x| <= 6) plus a rear cantilever latch with a thumb tab; retention at least 3x the total pin force"
    lip: {half_w: 6.0, overlap: 1.2, t: 1.6, clearance: 0.25}
    latch: {w: 24.0, t_root: 1.05, t_neck: 0.85, t_hook: 1.30, free_length: 11.65, hook_overlap: 1.10, rake_deg: 14.0, clearance: 0.25, stop_travel: 1.9, tab_stop_travel: 2.0}
  # E36: board 1.0 mm (was 1.6) so that the spring-pin tail (about 1.34 mm, PROVISIONAL: 8.3 overall less 6.96 above the
  # board, two search extracts, not the Mill-Max drawing) comes through by about 0.34 and can be soldered. top_z, which
  # sets the pin height, does NOT move; the underside moves up from z -6.455 to z -5.855.
  pcb: {dx: 30.0, dy: 22.0, thickness: 1.0, x: [-15.0, 15.0], y: [-34.2, -12.2], top_z: -4.855, screws: [[-12.5, -31.5], [12.5, -31.5], [-12.5, -14.5], [12.5, -14.5]], usb_mouth_y: -35.5, connector: "GCT USB4105 USB-C receptacle, rear exit", max_part_height_note: "nothing on the top side may reach the pocket ceiling; see mechanical/README"}
  print: {build_direction: x, tumbling: false}
# Top-side parts, REGENERATED at rev E from the routed board (electrical/gl1_main/out/gl1_main-mechanical.json; scratch
# script, see the hand-over): every fitted top-side part body, 87 entries + the cell.
# x, y = centre of the part BODY; dx, dy = the body as placed (axis-aligned box of the body corners; leads, pads and
# courtyard are NOT included; `courtyard` gives the footprint courtyard box x0, y0, x1, y1 for the larger parts);
# h = body height above the PCB top (z 1.8). `anchor` = footprint origin on the board where it is not the body centre
# (J1: the mechanical JSON gives the anchor as its x, y). fixed: true = position is a mechanical interface. The others
# were placed by the layout inside the tub_keepouts contract; this list follows the board, not the reverse.
# `class: passive` = two-terminal parts and resistor arrays (a consumer that wants only the larger parts filters on it).
# dnp: true = land on the board, part not fitted (R14 is the BQ25100 fallback position).
