# GreenLine GL-1 — master parameters (single source of truth for mechanical CAD and PCB layout)
# Units: mm. Frame: origin at puck centre on the BASE PLANE (the plane that rests on the turf),
# +x = right, +y = forward (toward the ball / hole), +z = up, as seen from above.
# Status of every dimension is given in `basis`: datasheet | search-verified | provisional (must be
# checked against the manufacturer drawing before release) | design (our choice).
rev: A-EVT1
envelope:
  outer_radius: 23.0          # dia 46.0, design
  thickness: 7.3              # design (driven by battery+LCD stack and camera+prism stack)
  wall: 1.0                   # side wall, MJF PA12 vapor-smoothed, design
  front_flat_y_outer: 18.4    # D-cut "visor" flat face that carries the two camera openings
  front_flat_wall: 0.8
base_plate:
  thickness: 1.0              # z 0..1.0
  radius: 21.85               # drops into the tub from below (0.15 radial clearance)
  flat_y: 18.25               # base plate runs UNDER the visor wall on the flat front (wall sits on the base there)
  seal_land: {r_inner: 21.35, r_outer: 21.85, flat_y_inner: 17.6}   # VHB/RTV band: under the tub ledge on the arc, under the visor wall on the flat
  grain_cavity: {x: 0.0, y: -4.0, dia: 13.0}    # through-opening; PCB bottom is the cavity ceiling
  pad_holes: {dia: 2.2, y: -17.0, xs: [-7.62, -5.08, -2.54, 0.0, 2.54, 5.08, 7.62]}
  feet: {ball_dia: 1.0, protrusion: 0.10, positions: [[0.0, 15.0], [-16.5, -9.5], [16.5, -9.5]]}
pcb:
  thickness: 0.8              # 4-layer FR-4, ENIG; z 1.0 .. 1.8
  z_bottom: 1.0
  radius: 21.2
  flat_y: 17.3
  component_edge_clearance: 0.2
  max_top_height_under_lcd: 2.55   # battery+swell or parts must stay below z = 4.35
tub_ledge: {r_inner: 21.35, z0: 1.2, z1: 2.2}    # inward step of the tub wall that seats on the seal
lcd:
  mpn: LS013B7DH03
  glass: {x: 0.0, y: -1.65, dx: 26.6, dy: 30.3, z0: 4.65, z1: 5.40}   # outline search-verified (Sharp brochure 26.6 x 30.3 x 0.746)
  active: {x: 0.0, y: 0.0, dx: 23.04, dy: 23.04}                         # active-area offset from glass centre is PROVISIONAL (1.65 mm)
  aperture_dia: 22.0
  fpc_exit_edge: rear        # driver ledge / FPC at the -y edge of the glass; tail geometry PROVISIONAL
  psa_thickness: 0.15
cover_glass: {dia: 28.0, thickness: 1.0, recess_dia: 28.3, recess_depth: 1.2, bond: "VHB 5907 ring 0.2 mm"}
battery:
  mpn: GM201030-PCB           # PowerStream, 2 x 10 x 30 mm cell + PCM (search-verified listing; PCM length provisional)
  body: {x: 0.0, y: -5.2, dx: 34.0, dy: 10.0, z0: 1.8, z1: 3.8}
  swell_allowance: 0.4
  foam_above: 0.3
cameras:
  mpn: OVM7692-RYAA           # 2.95 x 3.47 x 2.76 mm cube (search-verified product-brief dims); ball map PROVISIONAL
  body_dx: 3.47
  body_dy: 2.95
  height: 2.76
  left:  {x: -10.2, y: 15.6}
  right: {x: 10.2, y: 15.6}
  baseline: 20.4
  efl_mm: 1.15
  pixel_um: 1.75
  f_px: 657
  fov_deg: {h: 51.9, v: 40.1}     # landscape: 640 px along x
prisms:
  mpn: "Edmund Optics 32-526"     # 2.0 mm legs, N-BK7, aluminised hypotenuse (search-verified)
  leg: 2.0
  bond_line: 0.05
  # prism sits centred on the cube lens axis; exit face looks +y
  exit_face_y: 16.6
  optical_axis_z: 5.61            # 1.8 + 2.76 + 0.05 + 1.0
roof: {underside_z: 6.5, thickness: 0.8, prism_pocket_underside_z: 6.8}
visor_window:               # one per camera, centred on the camera x, bonded in a recess on the flat visor face
  w: 4.3
  h: 3.1
  t: 0.5
  recess_depth: 0.55         # recess is open to the top surface (window top edge flush with the top)
  z0: 4.2
  z1: 7.3
  opening: {half_w: 1.65, z0: 4.6, z1: 6.8}   # clear aperture through the visor wall, bevelled on the inside
  material: "EVT: 0.5 mm clear cast acrylic or cover glass; production: AR-coated borosilicate or sapphire, custom cut"
vent: {type: "adhesive ePTFE vent, OD <= 4.5 mm", hole_dia: 0.6, location: "roof underside in a lateral segment, about x=17, y=-3", basis: provisional}
top_side_parts:   # name, x, y, dx, dy, height (z above PCB top = 1.8); footprint courtyard sizes
  - {ref: U1,  name: "STM32U585RIT6 LQFP-64",       x: 0.0,   y: 7.2,   dx: 12.2, dy: 12.2, h: 1.6}
  - {ref: U2,  name: "OVM7692 camera L",            x: -10.2, y: 15.6,  dx: 3.47, dy: 2.95, h: 2.76}
  - {ref: U3,  name: "OVM7692 camera R",            x: 10.2,  y: 15.6,  dx: 3.47, dy: 2.95, h: 2.76}
  - {ref: U4,  name: "LSM6DSV16X IMU LGA-14",       x: -11.0, y: 6.0,   dx: 3.0,  dy: 2.5,  h: 0.86}
  - {ref: U5,  name: "IIS2ICLX inclinometer LGA-16",x: 12.0,  y: 6.0,   dx: 5.0,  dy: 5.0,  h: 1.7}
  - {ref: U6,  name: "SPI NOR flash USON",          x: -9.5,  y: 11.6,  dx: 3.2,  dy: 2.2,  h: 0.6}
  - {ref: U8,  name: "LP5907-2.8 LDO SOT-23-5",     x: 0.0,   y: 15.3,  dx: 3.0,  dy: 3.0,  h: 1.45}
  - {ref: BT1, name: "LiPo GM201030-PCB",           x: 0.0,   y: -5.2,  dx: 34.0, dy: 10.0, h: 2.4}
  - {ref: J1,  name: "LCD FPC conn 10p 0.5mm",      x: 0.0,   y: -13.9, dx: 10.4, dy: 4.6,  h: 1.2}
  - {ref: U7,  name: "MCP1700-3.0 LDO SOT-23",      x: 10.5,  y: -13.5, dx: 3.0,  dy: 3.0,  h: 1.2}
  - {ref: U9,  name: "MCP73831 charger SOT-23-5",   x: -10.5, y: -13.5, dx: 3.0,  dy: 3.0,  h: 1.45}
  - {ref: U10, name: "USBLC6-2SC6 ESD SOT-23-6",    x: -14.5, y: -12.0, dx: 3.0,  dy: 3.0,  h: 1.45}
  - {ref: Y1,  name: "32.768 kHz xtal 3215",        x: 8.6,   y: 12.2,  dx: 3.4,  dy: 1.7,  h: 0.9}
bottom_side_parts:
  grain_led_ring: {x: 0.0, y: -4.0, radius: 5.2, count_pairs: 8, led_height: 0.45}
  photodiode: {x: 0.0, y: -4.0, dx: 4.8, dy: 2.5, h: 0.48}
  pads: "7 gold pads dia 1.8 at base_plate.pad_holes (VBUS, D-, D+, GND, SWDIO, SWCLK, NRST)"
