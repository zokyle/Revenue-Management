# E23: battery-life and drop requirements (DESIGN_SPEC section 6). ALL PROPOSED until measured on EVT units; none is a
# measured figure. Test numbers are those of docs/VALIDATION_PLAN.md. No CAD or layout number depends on this block.
requirements:
  status: proposed
  reads_per_charge: {test: F6, min_at_20C_new_cell: 150, min_at_0C_or_after_300_cycles: 100, to: "low-battery symbol", model_to_empty: 600}
  standby_days: {test: F7, min_at_20C: 45, to: "low-battery symbol", model_days_to_empty: 76, model_sleep_current_uA: 23.7}   # firmware supply model of the rev E board, at the cell, underside dark (make test); the phase-2 model gave 87 days at 20.6
  ship_mode: {cell_current_max_uA: 5, months_min: 3, from_charge_percent: 30, cell_voltage_min: 3.0, modelled: false}
  drop: {test: K3, height_m: 1.0, surface: paving, attitudes: ["glass down", "base down", "visor flat", "rear edge", "left", "right"], level_zero_shift_max_mrad: 0.5, recorded_not_required_m: 1.5}
  step_on: "not a requirement at EVT (the crystal is not step-proof); a requirement for production"
