[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greenline-sim"
version = "0.2.0"
description = "Python reference for the GreenLine ball-marker putt physics, estimator and Monte-Carlo evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
fast = ["numba"]
test = ["pytest"]

[tool.setuptools]
packages = ["greenline_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # environment quirk of some matplotlib installs; the report uses 2-D plots only
    "ignore:Unable to import Axes3D:UserWarning",
]
