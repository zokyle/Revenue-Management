<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="t d">
<title id="t">GL-1 power model: current in each operating state</title>
<desc id="d">Horizontal bars on a logarithmic scale from 1 microamp to 100 milliamps. Ship mode 12.9 microamps, asleep dark 23.7, asleep lit 28.9, asleep in the cradle 98.6, result on the display about 0.75 milliamps, awake in the cradle 3.35 milliamps, charging 19.8 milliamps into the cell, read with cameras on about 96 milliamps. All values are from the firmware supply model, not measured.</desc>
<rect width="860" height="420" fill="#ffffff"/>
<text x="16.0" y="26.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Current in each state (MODEL, not a measurement)</text>
<text x="16.0" y="46.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Each step to the right is ten times more current. Source: firmware/build/readme/test.log, firmware/README.md</text>
<line x1="250.0" y1="74" x2="250.0" y2="354" stroke="#d8dee4" stroke-width="1"/>
<text x="250.0" y="372.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">1 µA</text>
<line x1="350.0" y1="74" x2="350.0" y2="354" stroke="#d8dee4" stroke-width="1"/>
<text x="350.0" y="372.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">10 µA</text>
<line x1="450.0" y1="74" x2="450.0" y2="354" stroke="#d8dee4" stroke-width="1"/>
<text x="450.0" y="372.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">100 µA</text>
<line x1="550.0" y1="74" x2="550.0" y2="354" stroke="#d8dee4" stroke-width="1"/>
<text x="550.0" y="372.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">1 mA</text>
<line x1="650.0" y1="74" x2="650.0" y2="354" stroke="#d8dee4" stroke-width="1"/>
<text x="650.0" y="372.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">10 mA</text>
<line x1="750.0" y1="74" x2="750.0" y2="354" stroke="#d8dee4" stroke-width="1"/>
<text x="750.0" y="372.0" font-size="12" fill="#59636e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">100 mA</text>
<text x="240.0" y="99.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Ship mode</text>
<path d="M250,85 H357.2 a4,4 0 0 1 4,4 V101 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="369.2" y="99.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">12.9 µA</text>
<text x="240.0" y="133.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Asleep, underside dark</text>
<path d="M250,119 H383.4 a4,4 0 0 1 4,4 V135 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="395.4" y="133.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">23.7 µA</text>
<text x="240.0" y="167.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Asleep, underside lit</text>
<path d="M250,153 H392.1 a4,4 0 0 1 4,4 V169 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="404.1" y="167.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">28.9 µA</text>
<text x="240.0" y="201.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Asleep in the cradle</text>
<path d="M250,187 H445.4 a4,4 0 0 1 4,4 V203 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="457.4" y="201.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">98.6 µA</text>
<text x="240.0" y="235.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Result on the display (45 s)</text>
<path d="M250,221 H533.5 a4,4 0 0 1 4,4 V237 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="545.5" y="235.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">about 0.75 mA</text>
<text x="240.0" y="269.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Awake in the cradle (USB)</text>
<path d="M250,255 H598.5 a4,4 0 0 1 4,4 V271 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="610.5" y="269.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">3.35 mA</text>
<text x="240.0" y="303.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Charging: current INTO the cell</text>
<path d="M250,289 H675.7 a4,4 0 0 1 4,4 V305 a4,4 0 0 1 -4,4 H250 Z" fill="#8c959f"/>
<text x="687.7" y="303.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">19.8 mA</text>
<text x="240.0" y="337.5" font-size="13" fill="#1f2328" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Read: cameras on (2.42 s)</text>
<path d="M250,323 H744.0 a4,4 0 0 1 4,4 V339 a4,4 0 0 1 -4,4 H250 Z" fill="#2f6fb0"/>
<text x="756.0" y="337.5" font-size="13" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">about 96 mA</text>
<line x1="319.9" y1="64" x2="319.9" y2="108" stroke="#1f2328" stroke-width="2" stroke-dasharray="4 3"/>
<text x="325.9" y="70.0" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">E23 limit for ship mode: 5 µA</text>
<line x1="250" y1="74" x2="250" y2="354" stroke="#59636e" stroke-width="1"/>
<text x="16.0" y="406.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Blue: drawn from the cell (in the cradle while charging: supplied by the charger). Grey: charge current into the cell.</text>
</svg>
