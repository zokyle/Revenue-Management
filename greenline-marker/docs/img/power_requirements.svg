<text x="16.0" y="26.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">The model against the E23 requirements (both PROPOSED, nothing measured)</text>
<text x="16.0" y="46.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Source: design/master_params.yaml requirements; firmware/build/readme/test.log</text>
<text x="16.0" y="82.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Reads per charge</text>
