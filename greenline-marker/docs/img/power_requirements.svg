<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-labelledby="t d">
<title id="t">GL-1 power model against the proposed requirements of E23</title>
<desc id="d">Four pairs of bars. Reads per charge: requirement at least 150, model 594 to empty. Standby: requirement at least 45 days, model 76 days to empty. Ship-mode current: requirement at most 5 microamps, model 12.9, not met. Ship mode from 30 percent charge: requirement at least 3 months, model 42 days, not met.</desc>
